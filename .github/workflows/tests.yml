# Tests de non-régression à chaque envoi : le moteur doit redonner le classeur Excel v2.2.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pytest -q
      # vulnérabilités connues dans les dépendances installées (streamlit et ses dépendances indirectes)
      - run: pip-audit
