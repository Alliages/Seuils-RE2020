# Thème de l'interface — palette : Ash Grey #bdbea9, Muted Teal #8db38b, Wisteria Blue #86a5d9,
# Gunmetal #3f4045, Bronze Spice #c75000 (voir aussi interface/style.py)
[theme]
base = "light"
primaryColor = "#c75000"
backgroundColor = "#efefea"
secondaryBackgroundColor = "#ffffff"
textColor = "#3f4045"
linkColor = "#c75000"
orangeColor = "#c75000"          # couleur des icônes de libellés (:orange[...])
borderColor = "#bdbea9"
baseRadius = "12px"
font = "Work Sans"

[theme.sidebar]
orangeColor = "#c75000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#efefea"
textColor = "#3f4045"

# Polices incluses dans le dépôt (static/polices, licence SIL OFL) : fonctionnent hors connexion
[[theme.fontFaces]]
family = "Work Sans"
url = "app/static/polices/work-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "Work Sans"
url = "app/static/polices/work-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "Work Sans"
url = "app/static/polices/work-sans-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "Work Sans"
url = "app/static/polices/work-sans-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "Archivo Black"
url = "app/static/polices/archivo-black-latin-400-normal.woff2"
weight = 400

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
